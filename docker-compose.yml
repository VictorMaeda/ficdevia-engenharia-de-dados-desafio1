services:
  postgres:
    image: postgres:16
    container_name: desafio_dados_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: desafio_dados_mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    # Sem autenticação por padrão (ambiente de desenvolvimento local).
    # Para exigir usuário/senha, defina MONGO_INITDB_ROOT_USERNAME e
    # MONGO_INITDB_ROOT_PASSWORD aqui e preencha MONGO_USER/MONGO_PASSWORD no .env.

  # A próxima etapa do desafio (embeddings/pgvector) pode reaproveitar
  # este arquivo, trocando a imagem do serviço "postgres" por uma com
  # a extensão pgvector ja instalada (ex.: pgvector/pgvector:pg16).

volumes:
  postgres_data:
  mongo_data:
