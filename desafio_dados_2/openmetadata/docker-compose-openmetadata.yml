# ==============================================================================
# DESAFIO PRÁTICO 2 - FIC DEV IA: FUNDAMENTOS DE DADOS PARA IA
# ARQUIVO: desafio_dados_2/openmetadata/docker-compose-openmetadata.yml
# REQUISITO: RF27 — Implantação e Integração do OpenMetadata
# FINALIDADE: Orquestração Docker Compose para implantação local do OpenMetadata
# NOTA: Requer no mínimo 8GB de RAM disponível na máquina hospedeira.
# ==============================================================================

version: '3.8'

services:
  openmetadata-mysql:
    image: mysql:8.0.35
    container_name: openmetadata-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${OPENMETADATA_MYSQL_PASSWORD:-openmetadata_root}
      MYSQL_DATABASE: openmetadata_db
      MYSQL_USER: openmetadata_user
      MYSQL_PASSWORD: ${OPENMETADATA_MYSQL_PASSWORD:-openmetadata_password}
    ports:
      - "3307:3306"
    volumes:
      - openmetadata_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  openmetadata-opensearch:
    image: opensearchproject/opensearch:2.7.0
    container_name: openmetadata-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1024m -Xmx1024m"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - openmetadata_opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 | grep -q 'opensearch'"]
      interval: 10s
      timeout: 5s
      retries: 5

  openmetadata-server:
    image: docker.getcollate.io/openmetadata/server:1.3.1
    container_name: openmetadata-server
    restart: unless-stopped
    depends_on:
      openmetadata-mysql:
        condition: service_healthy
      openmetadata-opensearch:
        condition: service_healthy
    environment:
      DB_HOST: openmetadata-mysql
      DB_PORT: 3306
      DB_USER: openmetadata_user
      DB_USER_PASSWORD: ${OPENMETADATA_MYSQL_PASSWORD:-openmetadata_password}
      SEARCH_TYPE: opensearch
      SEARCH_HOST: openmetadata-opensearch
      SEARCH_PORT: 9200
      AUTHENTICATION_PROVIDER: basic
      AUTHENTICATION_PUBLIC_KEYS: "[http://localhost:8585/api/v1/system/config/jwks]"
      AUTHENTICATION_AUTHORITY: "http://localhost:8585/api/v1/system/config/jwks"
      AUTHENTICATION_ENABLE_SELF_SIGNUP: "true"
    ports:
      - "8585:8585"
    volumes:
      - openmetadata_server_data:/opt/openmetadata
    # Conecta também à rede do Desafio 2 para acessar desafio_dados_postgres por hostname
    networks:
      - default
      - desafio2_network

volumes:
  openmetadata_mysql_data:
  openmetadata_opensearch_data:
  openmetadata_server_data:

# Rede externa do Docker Compose principal do Desafio 2
networks:
  default:
    driver: bridge
  desafio2_network:
    external: true
    name: ficdevia-engenharia-de-dados-desafio1_default
