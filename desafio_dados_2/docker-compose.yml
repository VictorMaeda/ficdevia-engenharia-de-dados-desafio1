services:
  postgres:
    image: postgres:16
    container_name: desafio2-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - desafio2_postgres_data:/var/lib/postgresql
      - ./sql/criar_banco.sql:/docker-entrypoint-initdb.d/01-criar-banco.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  desafio2_postgres_data:
